<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Propstar look</title>
    <style>
      .look-page {
        display: flex;
        flex-direction: column;
        gap: 16px;
        height: 100%;
        padding: 20px;
      }
      .look-page h1 {
        margin: 0;
        font: 600 18px/22px var(--font);
      }
      .look-grid {
        display: grid;
        flex: 1;
        grid-template-columns: repeat(2, 1fr);
        grid-auto-rows: minmax(0, 1fr);
        gap: 12px;
        min-height: 0;
      }
      .look-cell {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin: 0;
        padding: 12px;
        border-radius: var(--radius-lg);
        background: var(--color-surface);
        box-shadow: var(--shadow);
        min-height: 0;
      }
      .look-cell canvas {
        flex: 1;
        width: 100%;
        min-height: 0;
        border-radius: var(--radius-md);
      }
      .look-grid.single {
        grid-template-columns: 1fr;
      }
      .look-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .look-view {
        flex: 1;
        min-height: 0;
      }
      .look-storey {
        align-self: flex-start;
        height: 32px;
        padding-inline: 12px;
        border: 0;
        border-radius: var(--radius-full);
        background: var(--color-surface-2);
        color: var(--color-text);
        font: 500 13px/16px var(--font);
      }
      .look-kit-names {
        display: grid;
        grid-template-columns: repeat(5, max-content);
        gap: 2px 28px;
        margin: 0;
        padding-left: 20px;
        font: 400 12px/16px var(--font);
        color: var(--color-text-muted);
      }
      .look-cell figcaption {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        padding: 0 4px 4px;
      }
      .look-name {
        font: 600 14px/18px var(--font);
      }
      .look-meta {
        font: 400 12px/16px var(--font);
        color: var(--color-text-muted);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./lookPage.tsx"></script>
  </body>
</html>
